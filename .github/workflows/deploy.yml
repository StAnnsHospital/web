name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Verify Node.js version
      run: |
        node --version
        npm --version
        
    - name: Verify project structure
      run: |
        ls -la
        test -f package.json
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
          
    - name: Install dependencies
      run: |
        npm ci --prefer-offline --no-audit
        
    - name: Build
      run: |
        echo "Starting build process..."
        NODE_ENV=production npm run build
        echo "Build completed successfully"
      env:
        NODE_ENV: production
        
    - name: Fix asset paths for GitHub Pages
      run: |
        echo "Fixing asset paths for GitHub Pages deployment..."
        # Fix image paths in built HTML files
        find dist -name "*.html" -exec sed -i 's|src="/images/|src="/web/images/|g' {} \;
        find dist -name "*.html" -exec sed -i 's|href="/images/|href="/web/images/|g' {} \;
        find dist -name "*.html" -exec sed -i 's|src="/css/|src="/web/css/|g' {} \;
        find dist -name "*.html" -exec sed -i 's|href="/css/|href="/web/css/|g' {} \;
        find dist -name "*.html" -exec sed -i 's|src="/js/|src="/web/js/|g' {} \;
        find dist -name "*.html" -exec sed -i 's|href="/js/|href="/web/js/|g' {} \;
        echo "Asset paths fixed for GitHub Pages"
        
    - name: Verify build output
      run: |
        ls -la dist/
        test -f dist/index.html
        echo "Checking asset paths in built HTML..."
        echo "Image paths:"
        grep -o 'src="/web/images/[^"]*"' dist/index.html | head -5
        echo "CSS paths:"
        grep -o 'href="/web/css/[^"]*"' dist/index.html | head -5
        echo "JS paths:"
        grep -o 'src="/web/js/[^"]*"' dist/index.html | head -5
        echo "Checking if public assets are copied..."
        ls -la dist/images/ || echo "Images directory not found"
        ls -la dist/css/ || echo "CSS directory not found"
        ls -la dist/js/ || echo "JS directory not found"
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: ./dist
        
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'
