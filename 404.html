<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages - Fixed Version
      // This script handles SPA routing for GitHub Pages with proper trailing slash handling
      
      (function() {
        var l = window.location;
        
        // Check if we're already in a redirect loop by looking for the redirect pattern
        if (l.search.indexOf('?/') === 0) {
          // We're already redirected, don't redirect again
          return;
        }
        
        // Remove trailing slash from pathname to avoid issues
        var pathname = l.pathname;
        if (pathname.length > 1 && pathname.endsWith('/')) {
          pathname = pathname.slice(0, -1);
        }
        
        // Set pathSegmentsToKeep to 1 for GitHub Pages subdirectory
        var pathSegmentsToKeep = 1;
        
        // Build the redirect URL
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        
        // Only redirect if the URL is different to prevent loops
        if (redirectUrl !== l.href) {
          l.replace(redirectUrl);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
