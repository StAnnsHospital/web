    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script handles the redirect from 404.html and restores the correct URL
      (function() {
        var l = window.location;
        
        // Check if we have a redirect in the query string
        if (l.search.indexOf('?/') === 0) {
          try {
            // Get the full query string after ?/
            var fullQuery = l.search.slice(2);
            
            // Split by & to separate path from query parameters
            var parts = fullQuery.split('&');
            var pathPart = parts[0];
            var queryParts = parts.slice(1);
            
            // Decode the path (replace ~and~ with &)
            var decodedPath = pathPart.replace(/~and~/g, '&');
            
            // Remove trailing slash if present
            if (decodedPath.length > 1 && decodedPath.endsWith('/')) {
              decodedPath = decodedPath.slice(0, -1);
            }
            
            // Decode query parameters
            var decodedQuery = queryParts.map(function(part) {
              return part.replace(/~and~/g, '&');
            }).join('&');
            
            // Build the correct URL
            var correctUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + 
              decodedPath + (decodedQuery ? '?' + decodedQuery : '') + l.hash;
            
            // Only update if the URL is different to prevent loops
            if (correctUrl !== l.href) {
              window.history.replaceState(null, null, correctUrl);
            }
          } catch (e) {
            console.error('Error processing SPA redirect:', e);
          }
        }
      })();
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
